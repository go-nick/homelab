apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.*" # latest patch/minor auto updates

      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    grafana:
      adminPassword: admin
      nodeSelector:
        kubernetes.io/hostname: beelink-master

    prometheus:
      nodeSelector:
        kubernetes.io/hostname: beelink-master

    alertmanager:
      nodeSelector:
        kubernetes.io/hostname: beelink-master

    prometheusOperator:
      nodeSelector:
        kubernetes.io/hostname: beelink-master

    kube-state-metrics:
      nodeSelector:
        kubernetes.io/hostname: beelink-master


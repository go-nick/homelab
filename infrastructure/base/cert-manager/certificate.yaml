apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nicklab-org-tls
  namespace: cert-manager
spec:
  secretName: nicklab-org-tls
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "homarr,linkding,rrstack,zot,adguard,cattle-system"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "*.nicklab.org"
    - "nicklab.org"
    - "local.adguard.nicklab.org"
    - "local.prowlarr.nicklab.org"
    - "local.sabnzbd.nicklab.org"
    - "local.radarr.nicklab.org"
    - "local.sonarr.nicklab.org"

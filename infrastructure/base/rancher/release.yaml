apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rancher
  namespace: cattle-system
spec:
  interval: 1h
  chart:
    spec:
      chart: rancher
      version: "2.15.2"
      sourceRef:
        kind: HelmRepository
        name: rancher
        namespace: cattle-system
  valuesFrom:
    - kind: Secret
      name: rancher-bootstrap-secret
      valuesKey: bootstrapPassword
      targetPath: bootstrapPassword
  values:
    hostname: rancher.nicklab.org
    replicas: 1
    nodeSelector:
      kubernetes.io/hostname: beelink-master
    ingress:
      ingressClassName: traefik
      tls:
        source: secret
        secretName: nicklab-org-tls

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homarr-database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 50Mi
  volumeName: "homarr-pv"

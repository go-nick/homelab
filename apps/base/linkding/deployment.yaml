apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      securityContext:
        fsGroup: 33    # group ID
        runAsUser: 33  # user ID
        runAsGroup: 33 # group ID
      containers:
        - name: linkding
          image: sissbruecker/linkding:1.47.0
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: linkding-volume
              mountPath: /etc/linkding/data
          ports:
            - name: c-p-linkding
              containerPort: 9090
              protocol: TCP
          env:
            # supervisord can't drop privileges as non-root; huey runs in linkding-tasks sidecar
            - name: LD_DISABLE_BACKGROUND_TASKS
              value: "True"
          envFrom:
            - secretRef:
                name: linkding-container-env
        - name: linkding-tasks
          image: sissbruecker/linkding:1.47.0
          command: ["python", "manage.py", "run_huey", "-f"]
          workingDir: /etc/linkding
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: linkding-volume
              mountPath: /etc/linkding/data
          env:
            - name: HOME
              value: /tmp/home
          envFrom:
            - secretRef:
                name: linkding-container-env
      volumes:
        - name: linkding-volume
          persistentVolumeClaim:
            claimName: linkding-pvc

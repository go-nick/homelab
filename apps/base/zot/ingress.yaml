apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zot
  namespace: zot
spec:
  ingressClassName: traefik
  tls:
    - secretName: nicklab-org-tls
      hosts:
        - zot.nicklab.org
  rules:
    - host: zot.nicklab.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zot
                port:
                  number: 5000

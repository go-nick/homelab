apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: rrstack
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: prowlarr
  values:
    nodeSelector:
      kubernetes.io/hostname: old-white-worker

    controllers:
      main:
        containers:
          main:
            image:
              repository: lscr.io/linuxserver/prowlarr
              tag: latest
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: "America/Sao_Paulo"
            ports:
              - name: c-p-prowlarr
                containerPort: 9696
                protocol: TCP

    service:
      main:
        controller: main
        ports:
          s-p-prowlarr:
            port: 9696
            targetPort: c-p-prowlarr

    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: "prowlarr-pvc"
        globalMounts:
          - path: /config
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
  namespace: rrstack
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: sabnzbd
  values:
    nodeSelector:
      kubernetes.io/hostname: old-white-worker

    controllers:
      main:
        containers:
          main:
            image:
              repository: lscr.io/linuxserver/sabnzbd
              tag: latest
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: "America/Sao_Paulo"
            lifecycle:
              postStart:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - "sed -i 's/^host_whitelist.*/host_whitelist = local.sabnzbd.nicklab.org,sabnzbd/' /config/sabnzbd.ini 2>/dev/null || true"
            ports:
              - name: c-p-sabnzbd
                containerPort: 8080
                protocol: TCP

    service:
      main:
        controller: main
        ports:
          s-p-sabnzbd:
            port: 8080
            targetPort: c-p-sabnzbd

    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: "sabnzbd-pvc"
        globalMounts:
          - path: /config
      incomplete:
        type: persistentVolumeClaim
        existingClaim: "usenet-incomplete-pvc"
        globalMounts:
          - path: /incomplete-downloads
      downloads:
        type: persistentVolumeClaim
        existingClaim: "usenet-complete-pvc"
        globalMounts:
          - path: /downloads
---

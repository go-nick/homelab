apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: rrstack
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: prowlarr
  values:
    nodeSelector:
      kubernetes.io/hostname: old-white-worker

    controllers:
      main:
        containers:
          main:
            image:
              repository: lscr.io/linuxserver/prowlarr
              tag: latest
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: "America/Sao_Paulo"

    service:
      main:
        controller: main
        ports:
          http:
            port: 9696

    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: "prowlarr-pvc"
        globalMounts:
          - path: /config

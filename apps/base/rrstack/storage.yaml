# pattern as radarr-downloads-pv — independent PV/PVC pair bound to the same
# real directory so Sonarr can find and hardlink finished downloads too.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sonarr-downloads-pv
spec:
  storageClassName: ""
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce

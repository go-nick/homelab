apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard
  namespace: adguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adguard
  template:
    metadata:
      labels:
        app: adguard
    spec:
      nodeSelector:
        kubernetes.io/hostname: beelink-master
      containers:
      - name: adguard-home
        image: adguard/adguardhome:v0.107.78
        ports:
        - containerPort: 53 #dns
          name: dns
          protocol: UDP
        - containerPort: 3000 #initial setup
          name: http-initial
          # - containerPort: 80 #web gui
          #   name: http
          #   protocol: TCP
        volumeMounts:
        - name: adguard-data
          mountPath: /opt/adguardhome/work
          subPath: work
        - name: adguard-data
          mountPath: /opt/adguardhome/conf
          subPath: conf
        resources:
          requests:
            memory: "350Mi"
            cpu: "10m"
          limits:
            memory: "500Mi"
            cpu: "50m"  

      volumes:
      - name: adguard-data
        persistentVolumeClaim:
          claimName: adguard-pvc

apiVersion: v1
kind: PersistentVolume
metadata:
  name: homarr-pv
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
    
  hostPath:
    path: /var/lib/k8s-storage/homarr
  claimRef:
    name: homarr-database
    namespace: homarr

  storageClassName: "" # just to be sure (sanity check)
